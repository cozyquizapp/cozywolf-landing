<!doctype html>
<!--
  Das Vorschaubild fuer geteilte Links (og:image), 1200 auf 630.

  Wolf am 28.08.: "vorschaubild der website ist komplett veraltet". Stimmt, und
  der Grund war nicht Nachlaessigkeit, sondern dass es keine Quelle gab: das
  alte Bild war eine einzelne PNG-Datei ohne Bauanleitung. Deshalb liegt es
  jetzt als Seite hier, mit denselben Schriften, Farben und Objekten wie der
  Kopf der Website. Aendert sich die erste Zeile, aendert man sie hier mit und
  baut neu.

  Wolf am 28.08., zweite Meldung: "das vorschaubild ist nix", mit einem Bild
  einer Link-Vorschau. Grund: WhatsApp, Signal und die meisten Messenger
  zeigen die Vorschau quadratisch und schneiden mittig zu, also x 285 bis 915.
  Vom zweispaltigen Entwurf blieb dann "en / cht alles." uebrig, Wortmarke
  links und Objekte rechts fielen beide weg.

  Deshalb steht jetzt alles Wichtige mittig in diesem Quadrat, und die
  Gegenstaende liegen ringsum: vier innerhalb des Quadrats in dessen Ecken,
  zwei weiter aussen, die nur im breiten Zuschnitt zu sehen sind. Wer hier
  etwas verschiebt, prueft danach beide Zuschnitte mit tools/og-cover.mjs,
  das misst und meldet, wenn Text aus dem Quadrat laeuft.

  Neu bauen (Playwright muss auflösbar sein, notfalls global installiert):
    npm run build
    npx vite preview --port 4192 --strictPort &
    node tools/og-cover.mjs
-->
<html lang="de"><head><meta charset="utf-8">
<base href="http://localhost:4192/">
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;src:url('/fonts/bricolage-grotesque-latin-opsz-variable.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;src:url('/fonts/bricolage-grotesque-latin-ext-opsz-variable.woff2') format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'League Spartan';font-weight:900;src:url('/fonts/league-spartan-latin-900-normal.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0A0814;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#F6EFE6}
.blatt{position:relative;width:1200px;height:630px}

/* Der Schein sitzt ueber der Mitte des Quadrats, nicht ueber der Blattmitte
   der breiten Fassung -- beides ist hier x 600, deshalb dieselbe Angabe. */
.schein{position:absolute;left:50%;top:-46%;transform:translateX(-50%);width:1180px;height:900px;
  background:radial-gradient(ellipse at center,rgba(246,239,230,.075),rgba(10,8,20,0) 62%);pointer-events:none}

/* Der mittlere quadratische Ausschnitt: x 285 bis 915. Alles Wichtige liegt
   drin, mit 30 px Luft an beiden Seiten. */
.mitte{position:absolute;left:315px;top:0;width:570px;height:630px;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.marke{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.marke img{width:40px;height:40px}
.marke span{font-family:'League Spartan',sans-serif;font-weight:900;font-size:25px;letter-spacing:-.01em}
h1{font-family:'League Spartan',sans-serif;font-weight:900;font-size:74px;line-height:.86;letter-spacing:-.038em;white-space:nowrap}
h1 em{font-style:normal;color:#3B82F6}
p.sub{margin-top:20px;font-size:22px;line-height:1.4;font-weight:500;color:rgba(246,239,230,.80);max-width:24ch}
.fuss{display:flex;align-items:center;gap:12px;margin-top:26px;white-space:nowrap;
  font-size:13px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:rgba(246,239,230,.60)}
.fuss i{display:block;width:44px;height:1px;flex:none;background:rgba(246,239,230,.22)}

.objekte img{position:absolute;z-index:2;border-radius:16%;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
/* Die zwei aeusseren sind nur im breiten Zuschnitt zu sehen und deshalb
   etwas ruhiger, damit sie die Mitte nicht ueberstimmen. */
.objekte img.aussen{opacity:.9}
</style></head>
<body>
<div class="blatt">
  <div class="schein"></div>

  <div class="objekte">
    <!-- innerhalb des Quadrats, in dessen vier Ecken -->
    <img src="/assets/obj-puzzle.webp"         style="left:300px;top:26px;width:116px;transform:rotate(-9deg)">
    <img src="/assets/av-qq-crystal-ball.webp" style="left:790px;top:36px;width:104px;transform:rotate(11deg)">
    <img src="/assets/obj-sanduhr.webp"        style="left:312px;top:486px;width:92px;transform:rotate(-14deg)">
    <img src="/assets/av-qq-mushroom.webp"     style="left:788px;top:474px;width:106px;transform:rotate(7deg)">
    <!-- ausserhalb, nur im breiten Zuschnitt -->
    <img class="aussen" src="/assets/obj-gehirn.webp"   style="left:96px;top:236px;width:104px;transform:rotate(13deg)">
    <img class="aussen" src="/assets/av-qq-teapot.webp" style="left:1010px;top:246px;width:110px;transform:rotate(-10deg)">
  </div>

  <div class="mitte">
    <div class="marke"><img src="/logo.webp" alt=""><span>CozyWolf</span></div>
    <h1><em>Wissen</em><br>ist nicht alles.</h1>
    <p class="sub">Der gemütlichste Quizabend, den ihr je gespielt habt.</p>
    <div class="fuss"><i></i>Live-Quiz in Hamburg &middot; ab 350 &euro;<i></i></div>
  </div>
</div>
</body></html>
